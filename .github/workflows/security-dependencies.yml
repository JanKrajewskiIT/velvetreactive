name: Dependency security report
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .
      node-version-file:
        type: string
        default: .nvmrc
    secrets:
      NPM_READ_TOKEN:
        required: false
permissions:
  contents: read
  packages: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          registry-url: https://npm.pkg.github.com
          scope: '@jankrajewskiit'
      - name: Select declared npm
        run: npm install --global "$(node -p "require('./package.json').packageManager")" --ignore-scripts --registry https://registry.npmjs.org
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || github.token }}
          GHCR_TOKEN: ${{ secrets.NPM_READ_TOKEN || github.token }}
      - name: Save dependency findings and apply the existing advisory policy
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || github.token }}
          GHCR_TOKEN: ${{ secrets.NPM_READ_TOKEN || github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, mkdirSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          mkdirSync('reports/security', { recursive: true });
          const result = spawnSync('npm', ['audit', '--json'], { encoding: 'utf8', maxBuffer: 32 * 1024 * 1024 });
          let report;
          try { report = JSON.parse(result.stdout); } catch { report = null; }
          const available = !result.error && [0, 1].includes(result.status) && report?.vulnerabilities && !report.error;
          const findings = available ? Object.values(report.vulnerabilities).map(({ name, severity, range, isDirect, via }) => ({
            name, severity, range, isDirect,
            advisories: via.filter((value) => typeof value === 'object').map(({ source, name, severity, url, range }) => ({ source, name, severity, url, range })),
          })) : [];
          writeFileSync('reports/security/npm-audit.json', `${JSON.stringify({ revision: process.env.GITHUB_SHA, status: available ? 'completed' : 'unavailable', findings }, null, 2)}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Dependency security\n\nStatus: ${available ? 'completed' : 'unavailable'}. Affected packages: ${findings.length}.\n\nSee the dependency-security artifact. This workflow does not gate deployment.\n`);
          if (!available) throw new Error('Dependency scan unavailable; inspect registry access in the job logs.');
          const policy = spawnSync('npm', ['run', 'audit:deps'], { stdio: 'inherit' });
          if (policy.error || policy.status !== 0) process.exitCode = 1;
          NODE
      - name: Retain dependency security report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-security
          path: ${{ inputs.working-directory }}/reports/security/
          if-no-files-found: warn
          retention-days: 7
