name: Verify

on:
  workflow_call:
    secrets:
      NPM_REGISTRY_TOKEN:
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          GHCR_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
        env:
          GHCR_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}

      - name: Verify package
        run: npm run verify
