name: Code quality report
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .
      node-version-file:
        type: string
        default: .nvmrc
      verify-env:
        type: string
        default: '{}'
    secrets:
      NPM_READ_TOKEN:
        required: false
      CONFIGS_READ_TOKEN:
        required: false
permissions:
  contents: read
  packages: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: ${{ fromJSON(inputs.verify-env) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          registry-url: https://npm.pkg.github.com
          scope: '@jankrajewskiit'
      - name: Select declared npm
        run: npm install --global "$(node -p "require('./package.json').packageManager")" --ignore-scripts --registry https://registry.npmjs.org
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
        env:
          GHCR_TOKEN: ${{ secrets.NPM_READ_TOKEN || github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || github.token }}
      - name: Run all declared verification checks and record results
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const { scripts } = JSON.parse(readFileSync('package.json', 'utf8'));
          const expand = (name, parents = []) => {
            if (parents.includes(name) || typeof scripts[name] !== 'string')
              throw new Error(`Invalid verification script: ${name}`);
            if (!['verify', 'quality:check'].includes(name)) return [`npm run ${name}`];
            return scripts[name].split(' && ').flatMap((command) => {
              const script = command.match(/^npm run ([a-z0-9:-]+)$/)?.[1];
              return script ? expand(script, [...parents, name]) : [command];
            });
          };
          const checks = expand('verify').map((command) => {
            const script = command.match(/^npm run ([a-z0-9:-]+)$/)?.[1];
            if (script) return { command, args: ['run', script] };
            if (command === 'npm test') return { command, args: ['test'] };
            if (command === 'publint --strict')
              return { command, args: ['exec', '--no', '--', 'publint', '--strict'] };
            throw new Error(`Unsupported verification command: ${command}`);
          });
          const results = [];
          mkdirSync('reports/quality', { recursive: true });
          for (const { command, args } of checks) {
            console.info(`::group::${command}`);
            const result = spawnSync('npm', args, { stdio: 'inherit' });
            console.info('::endgroup::');
            results.push({ command, status: result.status === 0 ? 'passed' : 'failed', exitCode: result.status });
            writeFileSync('reports/quality/checks.json', `${JSON.stringify({ revision: process.env.GITHUB_SHA, results }, null, 2)}\n`);
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Code quality report\n\nFindings do not gate publication or deployment.\n\n| Check | Result |\n| --- | --- |\n${results.map(({ command, status }) => `| ${command} | ${status} |`).join('\n')}\n`);
          if (results.some(({ status }) => status === 'failed')) process.exitCode = 1;
          NODE
      - name: Retain quality and performance reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: code-quality
          path: |
            ${{ inputs.working-directory }}/reports/quality/
            ${{ inputs.working-directory }}/reports/performance.json
          if-no-files-found: warn
          retention-days: 7
